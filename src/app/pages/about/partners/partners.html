<!-- Hero -->
<section class="hero-gradient relative overflow-hidden -mt-16 pt-16 min-h-[220px] flex items-center">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 text-center relative w-full">
    <span class="tech-label text-sf-accent mb-6 block">About</span>
    <h1 class="font-display text-4xl sm:text-5xl lg:text-6xl font-800 text-white mb-6 animate-reveal-up">Technology Partners</h1>
    <div class="mt-8 animate-reveal-up delay-300">
      <a routerLink="/about" class="text-sm font-display font-medium text-white/40 hover:text-white transition-colors tracking-wide">
        &larr; Back to About
      </a>
    </div>
  </div>
</section>

<!-- Partners -->
<section class="py-24">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <app-section-header title="Our Partners" subtitle="Trusted by leading technology providers worldwide" />

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (partner of partners; track partner.name; let i = $index) {
        <div appScrollReveal class="bg-white border border-sf-grey/20 p-8 relative group hover:border-sf-blue/40 transition-all duration-300"
             [style.animation-delay.ms]="i * 100">
          <div class="flex items-start gap-6">
            <div class="w-24 h-16 flex items-center justify-center shrink-0">
              <img [src]="partner.logo" [alt]="partner.name" class="max-w-full max-h-full object-contain" />
            </div>

            <div>
              <h3 class="font-display text-xl font-bold text-sf-blue mb-3">{{ partner.name }}</h3>
              <p class="text-sf-text-mid leading-relaxed">{{ partner.description }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>

<app-cta-banner heading="Become a Partner" subheading="Join our ecosystem of industry-leading technology providers." buttonText="Contact Us" link="/contact" />
